<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460" role="img" aria-labelledby="t">
  <title id="t">Ilustração de landing page de alta conversão com botão de chamada para ação, gráfico de conversões e novo lead chegando pelo WhatsApp</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#10A98E" stop-opacity=".28"/>
      <stop offset="1" stop-color="#10A98E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C7A6"/>
      <stop offset="1" stop-color="#0B5F52"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14C7A6"/>
      <stop offset="1" stop-color="#10A98E" stop-opacity=".35"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <style>text{font-family:'Segoe UI',Roboto,Arial,sans-serif}</style>

  <circle cx="270" cy="220" r="250" fill="url(#glow)"/>

  <!-- Página -->
  <g filter="url(#sh)">
    <rect x="110" y="20" width="270" height="420" rx="16" fill="#101B2E" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M110 36a16 16 0 0 1 16-16h238a16 16 0 0 1 16 16v12H110z" fill="#16212F"/>
    <circle cx="128" cy="34" r="4" fill="#3A4757"/><circle cx="141" cy="34" r="4" fill="#3A4757"/><circle cx="154" cy="34" r="4" fill="#3A4757"/>

    <rect x="160" y="66" width="170" height="20" rx="10" fill="#10A98E" fill-opacity=".14" stroke="#10A98E" stroke-opacity=".4"/>
    <text x="245" y="80" font-size="10" font-weight="700" fill="#7FE3D0" text-anchor="middle">OFERTA POR TEMPO LIMITADO</text>
    <rect x="136" y="100" width="218" height="17" rx="5" fill="#fff"/>
    <rect x="160" y="124" width="170" height="17" rx="5" fill="#fff"/>
    <rect x="204" y="124" width="82" height="17" rx="5" fill="#10A98E"/>
    <rect x="150" y="152" width="190" height="7" rx="3.5" fill="#3A4757"/>
    <rect x="170" y="165" width="150" height="7" rx="3.5" fill="#3A4757"/>

    <rect x="136" y="186" width="218" height="104" rx="12" fill="url(#img)"/>
    <circle cx="245" cy="238" r="22" fill="#0B1421" fill-opacity=".45"/>
    <path d="M238 227l19 11-19 11z" fill="#fff"/>

    <!-- prova social -->
    <circle cx="150" cy="312" r="10" fill="#3A4757"/><circle cx="164" cy="312" r="10" fill="#4C5B6E"/><circle cx="178" cy="312" r="10" fill="#5E6E82"/>
    <rect x="196" y="304" width="90" height="7" rx="3.5" fill="#CBD7E4"/>
    <rect x="196" y="315" width="64" height="6" rx="3" fill="#3A4757"/>

    <!-- CTA -->
    <rect x="136" y="342" width="218" height="40" rx="12" fill="#10A98E"/>
    <text x="245" y="367" font-size="13" font-weight="800" fill="#04231E" text-anchor="middle">QUERO GARANTIR →</text>
    <rect x="176" y="396" width="138" height="6" rx="3" fill="#3A4757"/>

    <!-- cursor -->
    <path d="M318 370l0 30 8-8 6 13 6-3-6-12 11 0z" fill="#fff" stroke="#0B1421" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="318" cy="370" r="16" fill="none" stroke="#7FE3D0" stroke-opacity=".6" stroke-width="2"/>
  </g>

  <!-- Card gráfico -->
  <g filter="url(#sh)">
    <rect x="330" y="96" width="210" height="140" rx="14" fill="#16212F" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="348" y="122" font-size="11" fill="#8496AA">Leads por mês</text>
    <text x="348" y="146" font-size="22" font-weight="800" fill="#fff">Em alta</text>
    <path d="M448 140l10-12 10 12" fill="none" stroke="#14C7A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="350" y="196" width="20" height="24" rx="4" fill="url(#bar)"/>
    <rect x="380" y="184" width="20" height="36" rx="4" fill="url(#bar)"/>
    <rect x="410" y="176" width="20" height="44" rx="4" fill="url(#bar)"/>
    <rect x="440" y="164" width="20" height="56" rx="4" fill="url(#bar)"/>
    <rect x="470" y="160" width="20" height="60" rx="4" fill="url(#bar)"/>
    <rect x="500" y="148" width="20" height="72" rx="4" fill="#14C7A6"/>
  </g>

  <!-- Notificação de lead -->
  <g filter="url(#sh)">
    <rect x="20" y="250" width="200" height="66" rx="14" fill="#16212F" stroke="#10A98E" stroke-opacity=".45"/>
    <circle cx="48" cy="283" r="16" fill="#25D366"/>
    <path d="M41 291l2-6a9 9 0 1 1 4 4z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <text x="74" y="277" font-size="12" font-weight="700" fill="#fff">Novo lead!</text>
    <text x="74" y="295" font-size="10.5" fill="#8496AA">via campanha Google Ads</text>
  </g>

  <!-- Badge velocidade -->
  <g filter="url(#sh)">
    <rect x="356" y="330" width="170" height="54" rx="14" fill="#16212F" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="384" cy="357" r="14" fill="none" stroke="#3A4757" stroke-width="4"/>
    <path d="M384 343a14 14 0 1 1-13.3 18.3" fill="none" stroke="#14C7A6" stroke-width="4" stroke-linecap="round"/>
    <text x="408" y="353" font-size="11" fill="#8496AA">Carregamento</text>
    <text x="408" y="370" font-size="13" font-weight="800" fill="#fff">ultrarrápido</text>
  </g>
</svg>
