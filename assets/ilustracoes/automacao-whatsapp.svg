<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460" role="img" aria-labelledby="t">
  <title id="t">Ilustração de atendimento automático no WhatsApp com inteligência artificial respondendo um cliente às 23h e confirmando um agendamento</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#10A98E" stop-opacity=".3"/>
      <stop offset="1" stop-color="#10A98E" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <pattern id="wp" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="#ffffff" fill-opacity=".04"/>
    </pattern>
  </defs>
  <style>text{font-family:'Segoe UI',Roboto,Arial,sans-serif}</style>

  <circle cx="280" cy="220" r="250" fill="url(#glow)"/>

  <!-- Celular -->
  <g filter="url(#sh)">
    <rect x="160" y="10" width="240" height="440" rx="34" fill="#0B1421" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
    <rect x="171" y="21" width="218" height="418" rx="26" fill="#0D1B26"/>
    <rect x="171" y="21" width="218" height="418" rx="26" fill="url(#wp)"/>
    <!-- topo do chat -->
    <path d="M171 47a26 26 0 0 1 26-26h166a26 26 0 0 1 26 26v38H171z" fill="#16262F"/>
    <rect x="252" y="28" width="56" height="10" rx="5" fill="#0B1421"/>
    <circle cx="198" cy="64" r="14" fill="#10A98E"/>
    <path d="M192 64l4 4 8-8" fill="none" stroke="#04231E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="61" font-size="12" font-weight="700" fill="#fff">Sua Empresa</text>
    <circle cx="223" cy="73" r="3" fill="#25D366"/>
    <text x="230" y="76.5" font-size="9.5" fill="#7FE3D0">online · responde na hora</text>

    <!-- msg cliente -->
    <rect x="232" y="102" width="146" height="44" rx="12" fill="#0B5F52"/>
    <text x="242" y="120" font-size="10.5" fill="#E8FFF9">Oi! Vocês atendem</text>
    <text x="242" y="135" font-size="10.5" fill="#E8FFF9">no sábado?</text>
    <text x="370" y="142" font-size="8" fill="#A7E8DA" text-anchor="end">23:47</text>

    <!-- msg bot -->
    <rect x="182" y="156" width="172" height="60" rx="12" fill="#1E2C38"/>
    <text x="192" y="174" font-size="10.5" fill="#E8EEF5">Olá! Atendemos sim, das</text>
    <text x="192" y="189" font-size="10.5" fill="#E8EEF5">8h às 12h. Quer que eu</text>
    <text x="192" y="204" font-size="10.5" fill="#E8EEF5">agende um horário?</text>

    <!-- respostas rápidas -->
    <rect x="182" y="224" width="80" height="24" rx="12" fill="none" stroke="#14C7A6" stroke-opacity=".7"/>
    <text x="222" y="240" font-size="10" font-weight="700" fill="#7FE3D0" text-anchor="middle">Agendar</text>
    <rect x="270" y="224" width="84" height="24" rx="12" fill="none" stroke="#14C7A6" stroke-opacity=".7"/>
    <text x="312" y="240" font-size="10" font-weight="700" fill="#7FE3D0" text-anchor="middle">Ver preços</text>

    <!-- msg cliente -->
    <rect x="246" y="260" width="132" height="30" rx="12" fill="#0B5F52"/>
    <text x="256" y="279" font-size="10.5" fill="#E8FFF9">Sábado às 9h, pode?</text>

    <!-- msg bot confirmação -->
    <rect x="182" y="300" width="176" height="76" rx="12" fill="#1E2C38"/>
    <text x="192" y="318" font-size="10.5" fill="#E8EEF5">Prontinho! Agendado:</text>
    <rect x="192" y="326" width="156" height="38" rx="8" fill="#10A98E" fill-opacity=".14"/>
    <text x="202" y="342" font-size="10.5" font-weight="700" fill="#7FE3D0">Sábado · 09:00</text>
    <text x="202" y="356" font-size="9.5" fill="#A6B6C8">Lembrete 1 dia antes</text>

    <!-- digitando -->
    <rect x="182" y="388" width="52" height="24" rx="12" fill="#1E2C38"/>
    <circle cx="198" cy="400" r="3" fill="#8496AA"/><circle cx="208" cy="400" r="3" fill="#8496AA" fill-opacity=".7"/><circle cx="218" cy="400" r="3" fill="#8496AA" fill-opacity=".45"/>
  </g>

  <!-- Badge 24h -->
  <g filter="url(#sh)">
    <rect x="20" y="96" width="150" height="70" rx="16" fill="#16212F" stroke="#10A98E" stroke-opacity=".45"/>
    <circle cx="52" cy="131" r="17" fill="none" stroke="#14C7A6" stroke-width="3"/>
    <path d="M52 120v11l7 5" fill="none" stroke="#14C7A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="128" font-size="18" font-weight="800" fill="#fff">24h</text>
    <text x="80" y="146" font-size="10.5" fill="#8496AA">todos os dias</text>
  </g>

  <!-- Badge IA -->
  <g filter="url(#sh)">
    <rect x="390" y="150" width="152" height="64" rx="16" fill="#16212F" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="406" y="166" width="32" height="32" rx="9" fill="#10A98E" fill-opacity=".18"/>
    <path d="M422 172l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#14C7A6"/>
    <text x="448" y="179" font-size="12" font-weight="800" fill="#fff">IA treinada</text>
    <text x="448" y="195" font-size="10" fill="#8496AA">no seu negócio</text>
  </g>

  <!-- Badge vendas -->
  <g filter="url(#sh)">
    <rect x="384" y="318" width="160" height="64" rx="16" fill="#16212F" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="416" cy="350" r="16" fill="#25D366" fill-opacity=".2"/>
    <path d="M408 350l5.5 5.5 11-11" fill="none" stroke="#25D366" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="442" y="346" font-size="12" font-weight="800" fill="#fff">Venda fechada</text>
    <text x="442" y="362" font-size="10" fill="#8496AA">enquanto você dorme</text>
  </g>

  <!-- Badge humano -->
  <g filter="url(#sh)">
    <rect x="16" y="300" width="146" height="56" rx="16" fill="#16212F" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="42" cy="328" r="12" fill="#3A4757"/>
    <circle cx="42" cy="324" r="4.5" fill="#CBD7E4"/>
    <path d="M34 335a8 6 0 0 1 16 0" fill="#CBD7E4"/>
    <text x="62" y="325" font-size="11" font-weight="700" fill="#fff">Passa p/ humano</text>
    <text x="62" y="340" font-size="9.5" fill="#8496AA">quando precisar</text>
  </g>
</svg>
