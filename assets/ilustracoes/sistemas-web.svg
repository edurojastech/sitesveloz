<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460" role="img" aria-labelledby="t">
  <title id="t">Ilustração de sistema web sob medida: painel administrativo com indicadores, gráfico, tabela de registros e agendamento confirmado</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#10A98E" stop-opacity=".28"/>
      <stop offset="1" stop-color="#10A98E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14C7A6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#14C7A6" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <style>text{font-family:'Segoe UI',Roboto,Arial,sans-serif}</style>

  <circle cx="280" cy="220" r="250" fill="url(#glow)"/>

  <g filter="url(#sh)">
    <rect x="20" y="30" width="500" height="340" rx="16" fill="#101B2E" stroke="#ffffff" stroke-opacity=".12"/>
    <!-- sidebar -->
    <path d="M36 30h84v340H36a16 16 0 0 1-16-16V46a16 16 0 0 1 16-16z" fill="#0E1A2B"/>
    <rect x="36" y="48" width="22" height="22" rx="6" fill="#10A98E"/>
    <rect x="64" y="55" width="40" height="8" rx="4" fill="#E8EEF5"/>
    <rect x="32" y="92" width="76" height="24" rx="7" fill="#10A98E" fill-opacity=".16"/>
    <rect x="42" y="100" width="10" height="8" rx="2" fill="#14C7A6"/><rect x="58" y="100" width="40" height="8" rx="4" fill="#7FE3D0"/>
    <rect x="42" y="132" width="10" height="8" rx="2" fill="#3A4757"/><rect x="58" y="132" width="40" height="8" rx="4" fill="#3A4757"/>
    <rect x="42" y="158" width="10" height="8" rx="2" fill="#3A4757"/><rect x="58" y="158" width="34" height="8" rx="4" fill="#3A4757"/>
    <rect x="42" y="184" width="10" height="8" rx="2" fill="#3A4757"/><rect x="58" y="184" width="44" height="8" rx="4" fill="#3A4757"/>
    <rect x="42" y="210" width="10" height="8" rx="2" fill="#3A4757"/><rect x="58" y="210" width="30" height="8" rx="4" fill="#3A4757"/>
    <circle cx="48" cy="342" r="11" fill="#3A4757"/><rect x="64" y="338" width="40" height="8" rx="4" fill="#3A4757"/>

    <!-- topo -->
    <rect x="140" y="50" width="120" height="12" rx="5" fill="#fff"/>
    <rect x="400" y="46" width="100" height="22" rx="11" fill="#0B1421"/>
    <circle cx="414" cy="57" r="4.5" fill="none" stroke="#8496AA" stroke-width="1.6"/>

    <!-- KPIs -->
    <rect x="140" y="84" width="112" height="62" rx="10" fill="#16212F"/>
    <rect x="264" y="84" width="112" height="62" rx="10" fill="#16212F"/>
    <rect x="388" y="84" width="112" height="62" rx="10" fill="#16212F"/>
    <text x="152" y="104" font-size="10" fill="#8496AA">Pedidos</text>
    <text x="152" y="130" font-size="20" font-weight="800" fill="#fff">1.284</text>
    <text x="276" y="104" font-size="10" fill="#8496AA">Clientes ativos</text>
    <text x="276" y="130" font-size="20" font-weight="800" fill="#fff">436</text>
    <text x="400" y="104" font-size="10" fill="#8496AA">Agendamentos</text>
    <text x="400" y="130" font-size="20" font-weight="800" fill="#14C7A6">92</text>

    <!-- gráfico -->
    <rect x="140" y="158" width="236" height="120" rx="10" fill="#16212F"/>
    <path d="M152 254l30-18 28 8 30-30 30 10 30-26 30 6 24-20V266H152z" fill="url(#area)"/>
    <path d="M152 254l30-18 28 8 30-30 30 10 30-26 30 6 24-20" fill="none" stroke="#14C7A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="364" cy="184" r="5" fill="#14C7A6" stroke="#16212F" stroke-width="2"/>

    <!-- donut -->
    <rect x="388" y="158" width="112" height="120" rx="10" fill="#16212F"/>
    <circle cx="444" cy="218" r="32" fill="none" stroke="#3A4757" stroke-width="12"/>
    <circle cx="444" cy="218" r="32" fill="none" stroke="#14C7A6" stroke-width="12" stroke-dasharray="140 202" transform="rotate(-90 444 218)"/>
    <circle cx="444" cy="218" r="32" fill="none" stroke="#7FE3D0" stroke-width="12" stroke-dasharray="40 202" stroke-dashoffset="-140" transform="rotate(-90 444 218)"/>

    <!-- tabela -->
    <rect x="140" y="290" width="360" height="64" rx="10" fill="#16212F"/>
    <circle cx="160" cy="308" r="7" fill="#3A4757"/><rect x="174" y="304" width="90" height="7" rx="3.5" fill="#CBD7E4"/>
    <rect x="300" y="304" width="60" height="7" rx="3.5" fill="#3A4757"/>
    <rect x="430" y="300" width="56" height="16" rx="8" fill="#10A98E" fill-opacity=".18"/>
    <circle cx="160" cy="336" r="7" fill="#3A4757"/><rect x="174" y="332" width="74" height="7" rx="3.5" fill="#CBD7E4"/>
    <rect x="300" y="332" width="60" height="7" rx="3.5" fill="#3A4757"/>
    <rect x="430" y="328" width="56" height="16" rx="8" fill="#F5B841" fill-opacity=".2"/>
  </g>

  <!-- Card flutuante -->
  <g filter="url(#sh)">
    <rect x="300" y="352" width="240" height="78" rx="14" fill="#16212F" stroke="#10A98E" stroke-opacity=".45"/>
    <rect x="316" y="368" width="46" height="46" rx="10" fill="#10A98E" fill-opacity=".16"/>
    <rect x="326" y="380" width="26" height="24" rx="4" fill="none" stroke="#14C7A6" stroke-width="2.5"/>
    <path d="M326 388h26M332 376v7M346 376v7" stroke="#14C7A6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="376" y="386" font-size="12.5" font-weight="700" fill="#fff">Agendamento confirmado</text>
    <text x="376" y="404" font-size="10.5" fill="#8496AA">Automático · sem planilha</text>
  </g>

  <!-- Badge integração -->
  <g filter="url(#sh)">
    <rect x="34" y="384" width="176" height="46" rx="14" fill="#16212F" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="58" cy="407" r="10" fill="none" stroke="#7FE3D0" stroke-width="2.4"/>
    <path d="M53 407l3.5 3.5 6.5-7" fill="none" stroke="#7FE3D0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="412" font-size="12" font-weight="700" fill="#fff">Integrações via API</text>
  </g>
</svg>
