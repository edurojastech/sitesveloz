<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460" role="img" aria-labelledby="t">
  <title id="t">Ilustração de CRM personalizado: funil de vendas em quadro kanban com etapas novo lead, contato, proposta e fechado, e meta do mês</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#10A98E" stop-opacity=".28"/>
      <stop offset="1" stop-color="#10A98E" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <style>text{font-family:'Segoe UI',Roboto,Arial,sans-serif}</style>

  <circle cx="280" cy="220" r="250" fill="url(#glow)"/>

  <g filter="url(#sh)">
    <rect x="20" y="30" width="520" height="330" rx="16" fill="#101B2E" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="40" y="50" width="130" height="12" rx="5" fill="#fff"/>
    <rect x="430" y="45" width="90" height="22" rx="8" fill="#10A98E"/>
    <text x="475" y="60" font-size="10.5" font-weight="800" fill="#04231E" text-anchor="middle">+ Negócio</text>

    <!-- colunas -->
    <rect x="36" y="84" width="116" height="260" rx="10" fill="#0E1A2B"/>
    <rect x="160" y="84" width="116" height="260" rx="10" fill="#0E1A2B"/>
    <rect x="284" y="84" width="116" height="260" rx="10" fill="#0E1A2B"/>
    <rect x="408" y="84" width="116" height="260" rx="10" fill="#0E1A2B"/>
    <circle cx="50" cy="102" r="4" fill="#7FE3D0"/><text x="60" y="106" font-size="10.5" font-weight="700" fill="#CBD7E4">Novo lead</text>
    <circle cx="174" cy="102" r="4" fill="#5B9BFF"/><text x="184" y="106" font-size="10.5" font-weight="700" fill="#CBD7E4">Contato</text>
    <circle cx="298" cy="102" r="4" fill="#F5B841"/><text x="308" y="106" font-size="10.5" font-weight="700" fill="#CBD7E4">Proposta</text>
    <circle cx="422" cy="102" r="4" fill="#14C7A6"/><text x="432" y="106" font-size="10.5" font-weight="700" fill="#CBD7E4">Fechado</text>

    <!-- cards col 1 -->
    <g>
      <rect x="44" y="118" width="100" height="58" rx="8" fill="#16212F" stroke="#ffffff" stroke-opacity=".07"/>
      <rect x="54" y="129" width="62" height="7" rx="3.5" fill="#E8EEF5"/><rect x="54" y="142" width="44" height="6" rx="3" fill="#3A4757"/>
      <circle cx="62" cy="163" r="6" fill="#3A4757"/><rect x="104" y="158" width="30" height="10" rx="5" fill="#25D366" fill-opacity=".25"/>
      <rect x="44" y="184" width="100" height="58" rx="8" fill="#16212F" stroke="#ffffff" stroke-opacity=".07"/>
      <rect x="54" y="195" width="70" height="7" rx="3.5" fill="#E8EEF5"/><rect x="54" y="208" width="40" height="6" rx="3" fill="#3A4757"/>
      <circle cx="62" cy="229" r="6" fill="#4C5B6E"/>
      <rect x="44" y="250" width="100" height="58" rx="8" fill="#16212F" stroke="#ffffff" stroke-opacity=".07"/>
      <rect x="54" y="261" width="56" height="7" rx="3.5" fill="#E8EEF5"/><rect x="54" y="274" width="48" height="6" rx="3" fill="#3A4757"/>
      <circle cx="62" cy="295" r="6" fill="#5E6E82"/>
    </g>
    <!-- col 2 -->
    <g>
      <rect x="168" y="118" width="100" height="58" rx="8" fill="#16212F" stroke="#ffffff" stroke-opacity=".07"/>
      <rect x="178" y="129" width="66" height="7" rx="3.5" fill="#E8EEF5"/><rect x="178" y="142" width="40" height="6" rx="3" fill="#3A4757"/>
      <circle cx="186" cy="163" r="6" fill="#4C5B6E"/>
      <rect x="168" y="184" width="100" height="58" rx="8" fill="#16212F" stroke="#ffffff" stroke-opacity=".07"/>
      <rect x="178" y="195" width="54" height="7" rx="3.5" fill="#E8EEF5"/><rect x="178" y="208" width="46" height="6" rx="3" fill="#3A4757"/>
      <circle cx="186" cy="229" r="6" fill="#3A4757"/>
    </g>
    <!-- col 3 -->
    <g>
      <rect x="292" y="118" width="100" height="58" rx="8" fill="#16212F" stroke="#ffffff" stroke-opacity=".07"/>
      <rect x="302" y="129" width="60" height="7" rx="3.5" fill="#E8EEF5"/><rect x="302" y="142" width="44" height="6" rx="3" fill="#3A4757"/>
      <circle cx="310" cy="163" r="6" fill="#5E6E82"/>
    </g>
    <!-- col 4 -->
    <g>
      <rect x="416" y="118" width="100" height="58" rx="8" fill="#16212F" stroke="#14C7A6" stroke-opacity=".35"/>
      <rect x="426" y="129" width="64" height="7" rx="3.5" fill="#E8EEF5"/><rect x="426" y="142" width="40" height="6" rx="3" fill="#3A4757"/>
      <circle cx="434" cy="163" r="6" fill="#3A4757"/>
      <path d="M494 159l4 4 8-8" fill="none" stroke="#14C7A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="416" y="184" width="100" height="58" rx="8" fill="#16212F" stroke="#14C7A6" stroke-opacity=".35"/>
      <rect x="426" y="195" width="52" height="7" rx="3.5" fill="#E8EEF5"/><rect x="426" y="208" width="46" height="6" rx="3" fill="#3A4757"/>
      <circle cx="434" cy="229" r="6" fill="#4C5B6E"/>
      <path d="M494 225l4 4 8-8" fill="none" stroke="#14C7A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Card sendo arrastado -->
  <g filter="url(#sh2)" transform="rotate(-5 342 230)">
    <rect x="292" y="196" width="108" height="64" rx="9" fill="#1E2C40" stroke="#F5B841" stroke-opacity=".6"/>
    <rect x="303" y="208" width="64" height="7" rx="3.5" fill="#fff"/>
    <rect x="303" y="221" width="46" height="6" rx="3" fill="#8496AA"/>
    <circle cx="311" cy="244" r="6" fill="#5E6E82"/>
    <rect x="350" y="238" width="40" height="12" rx="6" fill="#F5B841" fill-opacity=".25"/>
  </g>
  <path d="M378 252l0 26 7-7 5 11 5-2-5-11 10 0z" fill="#fff" stroke="#0B1421" stroke-width="2" stroke-linejoin="round"/>

  <!-- Meta do mês -->
  <g filter="url(#sh)">
    <rect x="40" y="372" width="250" height="70" rx="14" fill="#16212F" stroke="#10A98E" stroke-opacity=".45"/>
    <text x="58" y="396" font-size="11" fill="#8496AA">Meta de vendas do mês</text>
    <text x="272" y="396" font-size="12" font-weight="800" fill="#14C7A6" text-anchor="end">78%</text>
    <rect x="58" y="410" width="214" height="10" rx="5" fill="#0B1421"/>
    <rect x="58" y="410" width="167" height="10" rx="5" fill="#14C7A6"/>
  </g>

  <!-- Lembrete WhatsApp -->
  <g filter="url(#sh)">
    <rect x="310" y="380" width="230" height="56" rx="14" fill="#16212F" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="336" cy="408" r="14" fill="#25D366"/>
    <path d="M330 415l1.8-5a8 8 0 1 1 3.4 3.4z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="360" y="404" font-size="11.5" font-weight="700" fill="#fff">Follow-up agendado</text>
    <text x="360" y="420" font-size="10" fill="#8496AA">Lembrete enviado no WhatsApp</text>
  </g>
</svg>
