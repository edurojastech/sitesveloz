<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460" role="img" aria-labelledby="t">
  <title id="t">Ilustração de site profissional responsivo, no computador e no celular, aparecendo na busca do Google em Uberlândia</title>
  <defs>
