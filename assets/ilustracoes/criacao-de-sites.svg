    <rect x="290" y="91" width="34" height="7" rx="3.5" fill="#3A4757"/>
    <rect x="332" y="91" width="34" height="7" rx="3.5" fill="#3A4757"/>
    <rect x="376" y="85" width="64" height="20" rx="7" fill="#10A98E"/>

